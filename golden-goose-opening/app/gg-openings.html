<title>Golden Goose Openings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: quiet top bar, one reading column. Each view reads top-down like an outline:
   headline sentence -> one visual -> detail grouped by area. Colour only for status and signals. */
:root {
  --bg: #F9F8F5;
  --surface: #FFFFFF;
  --ink: #26221F;
  --muted: #7C746C;
  --faint: #ABA298;
  --line: #ECE7DF;
  --line-strong: #D9D1C5;
  --gold: #9C7F45;
  --sand: #F1ECE3;
  --hover: #F4F0EA;
  --red: #B3261E;   --red-bg: #FBE8E6;
  --amber: #9A6200; --amber-bg: #FBF1DC;
  --blue: #2D5B88;  --blue-bg: #E6EEF6;
  --green: #2E6F48; --green-bg: #E3F0E7;
  --grey: #6B645D;  --grey-bg: #EFECE7;
  --shadow: 0 18px 50px rgba(38, 34, 31, .14);
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-ui: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151311; --surface: #1D1A17; --ink: #EEE8E0; --muted: #A89E93; --faint: #756D65;
    --line: #2B2723; --line-strong: #3C3732; --gold: #C8A96B; --sand: #26221E; --hover: #221F1B;
    --red: #F08A80; --red-bg: #3A1D1A; --amber: #E3B25C; --amber-bg: #352813;
    --blue: #8DB6E0; --blue-bg: #1B2A3A; --green: #85C79D; --green-bg: #17291E;
    --grey: #B1A89F; --grey-bg: #2A2622; --shadow: 0 18px 50px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151311; --surface: #1D1A17; --ink: #EEE8E0; --muted: #A89E93; --faint: #756D65;
  --line: #2B2723; --line-strong: #3C3732; --gold: #C8A96B; --sand: #26221E; --hover: #221F1B;
  --red: #F08A80; --red-bg: #3A1D1A; --amber: #E3B25C; --amber-bg: #352813;
  --blue: #8DB6E0; --blue-bg: #1B2A3A; --green: #85C79D; --green-bg: #17291E;
  --grey: #B1A89F; --grey-bg: #2A2622; --shadow: 0 18px 50px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .84em; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.red { color: var(--red); }
.amber { color: var(--amber); }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1360px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand b { font-family: var(--f-display); font-weight: 500; font-size: 20px; }
.brand span { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.nav { display: flex; gap: 2px; position: relative; }
.nav > button, .nav > .menu > button { border: 0; background: none; padding: 7px 12px; border-radius: 7px; color: var(--muted); font-weight: 600; font-size: 15px; transition: background .12s, color .12s; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--sand); }
.nav > button:hover, .nav > .menu > button:hover { color: var(--ink); background: var(--hover); }
.menu { position: relative; }
.menu-pop { position: absolute; top: calc(100% + 6px); left: 0; width: min(360px, 92vw); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; z-index: 40; display: grid; gap: 6px; max-height: 70vh; overflow-y: auto; }
.menu-pop input { width: 100%; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); }
.menu-group { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 8px 2px; }
.menu-item { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.menu-item:hover, .menu-item:focus-visible { background: var(--hover); }
.menu-item b { font-weight: 600; }
.menu-item span { font-size: 13px; color: var(--muted); }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.file { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.3; }
.file b { color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: border-color .12s; }
.btn:hover { border-color: var(--gold); }
.chip-q { border: 0; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.chip-q.ok { background: var(--green-bg); color: var(--green); cursor: default; }
.chip-q.warn { background: var(--amber-bg); color: var(--amber); }
.chip-q.err { background: var(--red-bg); color: var(--red); }

.demo { background: var(--sand); font-size: 14px; }
.demo div { max-width: 1360px; margin: 0 auto; padding: 7px 24px; }
.alert { max-width: 1360px; margin: 16px auto 0; padding: 0 24px; }
.alert div { background: var(--red-bg); color: var(--red); border-radius: 8px; padding: 12px 16px; }
main { max-width: 1360px; margin: 0 auto; padding: 36px 24px 80px; display: grid; gap: 44px; }
body.drop main { outline: 2px dashed var(--gold); outline-offset: 8px; border-radius: 12px; }

/* ---------- type ---------- */
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 46px; line-height: 1.05; margin: 6px 0 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0; }
.sec-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-head .spacer { flex: 1; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.linkbtn { border: 0; background: none; color: var(--gold); font-weight: 600; padding: 0; font-size: 14px; }
.linkbtn:hover { text-decoration: underline; }

/* ---------- story (program headline) ---------- */
.story { display: grid; gap: 14px; max-width: 900px; }
.story-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; font-size: 18px; }
.story-list li { display: grid; grid-template-columns: 18px 1fr; align-items: baseline; }
.story-list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transform: translateY(-3px); }
.story-list b { font-weight: 600; }
.story-list button { all: unset; cursor: pointer; border-bottom: 1px solid var(--line-strong); }
.story-list button:hover { border-color: var(--ink); }

/* ---------- runway (program) ---------- */
.rw { --cols: minmax(190px, 250px) minmax(380px, 1fr) 150px 210px; min-width: 900px; }
.rw-scroll { overflow-x: auto; }
.rw-row, .rw-axis { display: grid; grid-template-columns: var(--cols); gap: 18px; align-items: center; padding: 10px 12px; }
.rw-row { border-radius: 10px; cursor: pointer; transition: background .12s; border: 0; background: none; width: 100%; text-align: left; }
.rw-row:hover, .rw-row:focus-visible { background: var(--surface); box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line); }
.rw-row:hover .rw-name b { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; }
.rw-axis { padding-top: 0; padding-bottom: 4px; }
.rw-name { display: grid; gap: 2px; min-width: 0; }
.rw-name b { font-size: 17px; font-weight: 600; }
.rw-name span { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.rw-track { position: relative; height: 24px; }
.rw-ticks { position: relative; height: 18px; }
.rw-ticks span { position: absolute; top: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); transform: translateX(-2px); white-space: nowrap; }
.rw-ticks .today { color: var(--gold); font-weight: 700; transform: translateX(-50%); }
.rw-line { position: absolute; top: 11px; height: 2px; background: var(--line-strong); border-radius: 1px; }
.rw-elapsed { position: absolute; top: 10px; height: 4px; background: var(--ink); border-radius: 2px; opacity: .78; }
.rw-slip { position: absolute; top: 11px; height: 0; border-top: 2px dashed var(--red); }
.rw-base { position: absolute; top: 7px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--faint); background: var(--bg); transform: translateX(-50%); }
.rw-dot { position: absolute; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transform: translateX(-50%); box-shadow: 0 0 0 3px var(--bg); }
.rw-dot.tent { background: var(--bg); border: 2px solid var(--ink); }
.rw-dot.late { background: var(--red); }
.rw-today { position: absolute; top: -10px; bottom: -10px; width: 0; border-left: 1px solid var(--gold); opacity: .6; }
.rw-date { display: grid; gap: 1px; }
.rw-date b { font-weight: 600; font-size: 15px; }
.rw-date s { color: var(--faint); font-size: 13px; }
.rw-date span { font-size: 13px; color: var(--muted); }
.rw-prog { display: flex; align-items: center; gap: 12px; }
.rw-prog .sig { display: grid; gap: 1px; font-size: 13px; }
.donut { width: 38px; height: 38px; flex: none; }
.donut circle { fill: none; stroke-width: 4; }
.donut .bg { stroke: var(--grey-bg); }
.donut .fg { stroke: var(--green); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.donut text { font-size: 10px; font-weight: 700; fill: var(--ink); font-family: var(--f-ui); }
.rw-group { margin: 22px 12px 6px; }
.legend-rw { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 0 12px; }
.legend-rw span { display: inline-flex; align-items: center; gap: 8px; }
.lg-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); display: inline-block; }
.lg-dot.tent { background: transparent; border: 2px solid var(--ink); }
.lg-dot.late { background: var(--red); }
.lg-slip { width: 22px; border-top: 2px dashed var(--red); display: inline-block; }
.lg-el { width: 22px; height: 4px; background: var(--ink); opacity: .78; border-radius: 2px; display: inline-block; }

/* ---------- identity card (opening) ---------- */
.idcard { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.id-main { display: grid; gap: 20px; min-width: 0; }
.idrow { display: flex; flex-wrap: wrap; gap: 10px 26px; font-size: 16px; color: var(--ink); }
.idrow > span { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.idrow .ico { color: var(--muted); }
.idrow s { color: var(--faint); }
.cx { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.cx i { width: 4px; border-radius: 1px; background: var(--line-strong); display: block; }
.cx i.on { background: var(--ink); }
.headline { font-size: 19px; }
.headline b { font-weight: 600; }
.sbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--grey-bg); }
.sbar.big { height: 12px; border-radius: 6px; }
.seg { display: block; height: 100%; }
.seg-done { background: var(--green); } .seg-progress { background: var(--blue); } .seg-blocked { background: var(--red); } .seg-todo { background: var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--ink); font-weight: 600; }
.att-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 10px; min-width: 0; }
.att { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; }
.att button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: start; padding: 8px 6px; border-radius: 8px; cursor: pointer; transition: background .12s; }
.att button:hover, .att button:focus-visible { background: var(--hover); }
.att-t { font-weight: 600; font-size: 15px; display: grid; min-width: 0; }
.att-t .sub { font-weight: 400; }

/* ---------- pills & tags ---------- */
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; justify-self: start; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-blocked { background: var(--red-bg); color: var(--red); }
.st-progress { background: var(--blue-bg); color: var(--blue); }
.st-done { background: var(--green-bg); color: var(--green); }
.st-todo { background: var(--grey-bg); color: var(--grey); }
.st-na { background: transparent; color: var(--faint); }
.st-bad { background: var(--red-bg); color: var(--red); }
.st-dec { background: var(--amber-bg); color: var(--amber); }
.st-soon { background: var(--grey-bg); color: var(--grey); }
.tag { display: inline-block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 8px; vertical-align: 2px; }
.tag.dec { background: var(--amber-bg); color: var(--amber); }
.tag.crit { color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.flag { display: inline-grid; place-items: center; min-width: 17px; height: 17px; border-radius: 9px; font-size: 11px; font-weight: 700; margin-left: 6px; padding: 0 5px; vertical-align: 1px; }
.flag.err { background: var(--red); color: var(--surface); }
.flag.warn { background: var(--amber-bg); color: var(--amber); }
.sub { font-size: 13px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.d-blocked { background: var(--red); } .d-progress { background: var(--blue); } .d-done { background: var(--green); } .d-todo { background: transparent; box-shadow: inset 0 0 0 2px var(--line-strong); } .d-na { background: var(--line); }
.due-over { color: var(--red); font-weight: 700; }
.due-soon { color: var(--amber); font-weight: 600; }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input[type="search"] { padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); flex: 1 1 220px; max-width: 320px; min-width: 0; }
.ms { position: relative; }
.ms-btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; transition: border-color .12s; }
.ms-btn:hover { border-color: var(--gold); }
.ms-btn b { background: var(--ink); color: var(--bg); border-radius: 9px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.ms-btn .car { color: var(--muted); font-size: 11px; }
.ms-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; min-width: 240px; max-height: 360px; overflow-y: auto; display: grid; gap: 1px; }
.ms-pop label { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.ms-pop label:hover { background: var(--hover); }
.ms-pop input { accent-color: var(--ink); margin: 0; }
.ms-foot { display: flex; justify-content: space-between; padding: 6px 8px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sand); border: 0; border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 600; }
.chip span { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.chip:hover span { background: var(--line-strong); color: var(--ink); }
.count { font-size: 14px; color: var(--muted); margin-left: auto; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--surface); padding: 6px 14px; font-weight: 600; font-size: 14px; color: var(--muted); transition: background .12s; }
.seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- outline (opening) ---------- */
.ol { display: grid; gap: 6px; }
.ol-area { border-top: 1px solid var(--line); }
.ol-head { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 22px minmax(160px, 1fr) minmax(120px, 240px) 150px; gap: 14px; align-items: center; padding: 14px 8px; cursor: pointer; border-radius: 8px; transition: background .12s; }
.ol-head:hover, .ol-head:focus-visible { background: var(--hover); }
.ol-head .car { color: var(--muted); transition: transform .15s; display: inline-block; }
.ol-head[aria-expanded="false"] .car { transform: rotate(-90deg); }
.ol-head .an { font-size: 18px; font-weight: 600; }
.ol-head .an span { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 10px; }
.ol-head .ac { font-size: 14px; color: var(--muted); text-align: right; }
.ol-tasks { list-style: none; margin: 0 0 12px; padding: 0 0 0 30px; display: grid; }
.ol-task { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) 150px 88px 60px; gap: 4px 16px; align-items: baseline; padding: 10px 8px; border-radius: 8px; cursor: pointer; transition: background .12s; }
.ol-task:hover, .ol-task:focus-visible, .ol-task.sel { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.ol-task .dot { transform: translateY(1px); }
.ol-task .tt { font-weight: 600; font-size: 16px; min-width: 0; }
.ol-task .tt .mono { color: var(--faint); font-weight: 400; margin-right: 8px; }
.ol-task .ow, .ol-task .du, .ol-task .pr { font-size: 14px; }
.ol-task .ow { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ol-task .pr { text-align: right; color: var(--muted); }
.ol-task .up { grid-column: 2 / -1; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.ol-task .up b { font-weight: 600; color: var(--muted); }
.ol-task .blk { color: var(--red); }
.ol-task.done .tt { color: var(--muted); font-weight: 500; }

/* ---------- board ---------- */
.board-wrap { overflow-x: auto; }
.board { display: grid; grid-template-columns: 150px repeat(4, minmax(220px, 1fr)); gap: 10px; min-width: 1060px; }
.bcol-head { padding: 4px 2px 6px; font-size: 14px; }
.lane-head { padding: 10px 4px; display: grid; align-content: start; gap: 2px; font-size: 15px; font-weight: 600; border-top: 1px solid var(--line); }
.lane-head span { font-size: 13px; font-weight: 400; }
.bcell { display: grid; gap: 8px; align-content: start; padding: 8px; background: var(--sand); border-radius: 10px; min-height: 52px; min-width: 0; }
.card { all: unset; box-sizing: border-box; display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; min-width: 0; transition: border-color .12s; }
.card:hover, .card:focus-visible { border-color: var(--gold); }
.card.sel { border-color: var(--ink); }
.card-top { font-size: 12px; color: var(--muted); }
.card-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.card-blk { font-size: 13px; color: var(--red); line-height: 1.3; }
.card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.card.done { font-size: 13px; color: var(--muted); padding: 7px 10px; background: transparent; border-style: dashed; }

/* ---------- matrix + cross table (areas) ---------- */
.area-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.achip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; transition: background .12s, border-color .12s; }
.achip:hover { border-color: var(--gold); }
.achip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mx-wrap { overflow-x: auto; }
.mx { border-collapse: separate; border-spacing: 4px; }
.mx th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding: 0 4px 6px; vertical-align: bottom; max-width: 110px; }
.mx th.rowh { text-align: left; font-size: 15px; color: var(--ink); font-weight: 600; white-space: nowrap; padding-right: 14px; vertical-align: middle; }
.mx td { padding: 0; }
.mx-cell { all: unset; box-sizing: border-box; width: 92px; height: 46px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; font-weight: 600; position: relative; cursor: pointer; transition: transform .1s, box-shadow .12s; }
.mx-cell:hover, .mx-cell:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
.mx-cell.on { box-shadow: 0 0 0 2px var(--gold); }
.mx-cell.none { color: var(--faint); cursor: default; background: transparent; box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
.mx-cell i { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.xt-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.xt { width: 100%; border-collapse: collapse; min-width: 1000px; }
.xt th { text-align: left; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.xt td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
.xt tr.grp td { background: var(--sand); font-weight: 600; font-size: 14px; padding: 9px 14px; }
.xt tr.row { cursor: pointer; transition: background .12s; }
.xt tr.row:hover td, .xt tr.row.sel td { background: var(--hover); }
.xt tr.done td { color: var(--faint); }
.xt .tt { font-weight: 600; }
.empty { padding: 26px; text-align: center; color: var(--muted); }

/* ---------- panel ---------- */
.scrim { position: fixed; inset: 0; background: rgba(20, 17, 14, .16); z-index: 30; }
.panel { position: fixed; top: 0; right: 0; height: 100%; width: min(500px, 100%); background: var(--surface); box-shadow: var(--shadow); z-index: 31; display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.panel-head { padding: calc(18px + env(safe-area-inset-top, 0px)) 24px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.panel-top { display: flex; align-items: center; gap: 10px; }
.panel-top .x { margin-left: auto; border: 0; background: none; font-size: 26px; line-height: 1; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.panel-top .x:hover { background: var(--hover); color: var(--ink); }
.panel h3 { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 0; text-wrap: balance; }
.panel-body { overflow-y: auto; padding: 20px 24px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; align-content: start; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 10px 16px; margin: 0; font-size: 15px; }
.kv dt { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding-top: 3px; }
.kv dd { margin: 0; min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.box.warnbox { background: var(--amber-bg); border-color: transparent; color: var(--amber); }
.box.errbox { background: var(--red-bg); border-color: transparent; color: var(--red); }
.box ul { margin: 6px 0 0; padding-left: 18px; }
.tl { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 14px; }
.tl li { display: grid; gap: 2px; padding-left: 14px; border-left: 2px solid var(--line); color: var(--faint); }
.tl li:first-child { border-left-color: var(--gold); color: var(--ink); }
.tl .d { font-size: 13px; font-weight: 600; }
.tl .t { font-size: 15.5px; }
.tl .s { font-size: 12px; }
.prog { display: flex; align-items: center; gap: 10px; }
.track { flex: 1; height: 5px; background: var(--grey-bg); border-radius: 3px; overflow: hidden; max-width: 200px; }
.fill { height: 100%; background: var(--gold); display: block; }

@media (max-width: 980px) { .idcard { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .bar-in, main, .demo div, .alert { padding-left: 16px; padding-right: 16px; }
  h1 { font-size: 36px; }
  .story-list { font-size: 16px; }
  .file { display: none; }
  .ol-head { grid-template-columns: 22px 1fr; }
  .ol-head .sbar, .ol-head .ac { grid-column: 2; text-align: left; }
  .ol-tasks { padding-left: 8px; }
  .ol-task { grid-template-columns: 16px 1fr auto; }
  .ol-task .ow { grid-column: 2; }
  .ol-task .pr { display: none; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  main > * { animation: rise .22s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>

// ---------------------------------------------------------------- utils
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dayOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const TODAY = dayOnly(new Date());

function toDate(v) {
  if (v == null || v === "") return null;
  if (v instanceof Date) return isNaN(v) ? undefined : dayOnly(v);
  if (typeof v === "number") {
    const u = new Date(Date.UTC(1899, 11, 30) + Math.round(v * 86400000));
    return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate());
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return undefined; // present but not a date
}
function toDateTime(v) {
  if (typeof v === "number") return new Date(Date.UTC(1899, 11, 30) + Math.round(v * 86400000)).getTime();
  const d = toDate(v); return d ? d.getTime() : 0;
}
const fmtDate = (d, withYear = true) => d ? `${String(d.getDate()).padStart(2, "0")} ${MONTHS[d.getMonth()]}${withYear || d.getFullYear() !== TODAY.getFullYear() ? " " + d.getFullYear() : ""}` : "—";
const toBool = (v) => v === true || /^(true|vero|yes|1|x)$/i.test(String(v ?? "").trim());
const str = (v) => (v == null ? "" : String(v).trim());

// working days, Monday to Friday, both ends included (same as NETWORKDAYS)
function networkdays(a, b) {
  if (!a || !b) return null;
  if (a > b) return -networkdays(b, a);
  let n = 0;
  for (let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
  return n;
}
// signed working days from a to b, start day excluded
const wdBetween = (a, b) => (!a || !b ? null : a <= b ? networkdays(a, b) - 1 : -(networkdays(b, a) - 1));
const signed = (n) => (n == null ? "—" : n > 0 ? `+${n}` : String(n));

// ---------------------------------------------------------------- model
const STATUSES = ["Not Started", "In Progress", "Blocked", "Completed", "N/A"];
const STATUS_ORDER = { "Blocked": 0, "In Progress": 1, "Not Started": 2, "Completed": 3, "N/A": 4 };
const STATUS_CLASS = { "Blocked": "st-blocked", "In Progress": "st-progress", "Completed": "st-done", "Not Started": "st-todo", "N/A": "st-na" };
const PROGRESS = [0, 25, 50, 75, 100];
const REQUIRED = {
  ACTION_LOG: ["Task ID", "Opening Type", "Location", "Macro Area", "Task", "Status", "Progress %", "Owner 1 (Lead)", "Due Date"],
  OPENINGS: ["Opening Code", "Opening Type", "Location"],
};

function readSheet(wb, name) {
  const ws = wb.Sheets[name];
  if (!ws) return null;
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
  if (!rows.length) return { headers: [], rows: [] };
  const headers = rows[0].map((h) => str(h));
  const out = rows.slice(1).map((r) => { const o = {}; headers.forEach((h, i) => { if (h) o[h] = r[i]; }); return o; })
    .filter((o) => Object.values(o).some((v) => v != null && v !== ""));
  return { headers, rows: out };
}

function buildModel(wb) {
  const missing = [];
  const sheets = {};
  for (const [name, cols] of Object.entries(REQUIRED)) {
    const s = readSheet(wb, name);
    if (!s) { missing.push(`sheet ${name}`); continue; }
    cols.filter((c) => !s.headers.includes(c)).forEach((c) => missing.push(`${name} › ${c}`));
    sheets[name] = s;
  }
  if (missing.length) throw new Error("This file does not match the Action Log template. Missing: " + missing.join(", ") + ".");
  const hist = readSheet(wb, "TASK_HISTORY")?.rows || [];
  const odh = readSheet(wb, "OPENING_DATE_HISTORY")?.rows || [];
  const areasRows = readSheet(wb, "AREAS")?.rows || null;
  const ownersRows = readSheet(wb, "OWNERS")?.rows || null;

  const areaOrder = new Map();
  const areaPairs = areasRows ? new Set(areasRows.map((r) => `${str(r["Macro Area"])}|${str(r["Sub Area"])}`)) : null;
  const macros = areasRows ? new Set(areasRows.map((r) => str(r["Macro Area"]))) : null;
  (areasRows || []).forEach((r, i) => { const m = str(r["Macro Area"]); if (!areaOrder.has(m)) areaOrder.set(m, i); });
  const owners = ownersRows ? new Set(ownersRows.map((r) => str(r["Owner Name"])).filter(Boolean)) : null;

  // openings + opening date history
  const openings = sheets.OPENINGS.rows.filter((r) => str(r["Opening Code"])).map((r) => {
    const code = str(r["Opening Code"]);
    const hist = odh.filter((h) => str(h["Opening Code"]) === code)
      .map((h, i) => ({ type: str(h["Entry Type"]), decided: toDate(h["Decided On"]) || null, date: toDate(h["New Opening Date"]) || null, reason: str(h["Reason"]), i }))
      .filter((h) => h.date)
      .sort((a, b) => (a.decided - b.decided) || (a.i - b.i));
    const base = hist.find((h) => h.type === "Baseline") || hist[0] || null;
    const cur = hist[hist.length - 1] || null;
    const o = {
      code, type: str(r["Opening Type"]), location: str(r["Location"]), country: str(r["Country"]),
      complexity: str(r["Complexity"]), start: toDate(r["Project Start Date"]) || null, status: str(r["Opening Status"]),
      baseline: base ? base.date : toDate(r["Baseline Opening Date"]) || null,
      current: cur ? cur.date : toDate(r["Current Opening Date"]) || null,
      postponements: hist.filter((h) => h.type === "Change").length, dateHistory: hist, tasks: [],
    };
    o.delay = wdBetween(o.baseline, o.current);
    o.elapsed = o.start ? (o.status === "Opened" ? networkdays(o.start, o.current) : networkdays(o.start, TODAY)) : null;
    o.remaining = o.current ? (o.status === "Opened" ? 0 : wdBetween(TODAY, o.current)) : null;
    return o;
  });
  const byPair = new Map(openings.map((o) => [`${o.type}|${o.location}`, o]));
  const byCode = new Map(openings.map((o) => [o.code, o]));

  // notes per task
  const notesBy = new Map();
  hist.forEach((h) => {
    const id = str(h["Task ID"]); const text = str(h["Note"]);
    if (!id || !text || /^rilevato nel foglio$/i.test(text)) return;
    if (!notesBy.has(id)) notesBy.set(id, []);
    notesBy.get(id).push({ date: toDate(h["Event Date"]) || null, rec: toDateTime(h["Recorded At"]), text, type: str(h["Note Type"]) || "Update", source: str(h["Source"]) });
  });

  const idCount = new Map();
  sheets.ACTION_LOG.rows.forEach((r) => { const id = str(r["Task ID"]); if (id) idCount.set(id, (idCount.get(id) || 0) + 1); });

  const tasks = sheets.ACTION_LOG.rows.map((r) => {
    const raw = { open: r["Task Open Date"], due: r["Due Date"], lud: r["Latest Update Date"] };
    let progress = r["Progress %"];
    if (typeof progress === "number" && progress > 0 && progress <= 1) progress = Math.round(progress * 100);
    const t = {
      id: str(r["Task ID"]), type: str(r["Opening Type"]), location: str(r["Location"]),
      macro: str(r["Macro Area"]), sub: str(r["Sub Area"]), task: str(r["Task"]), desc: str(r["Description"]),
      status: str(r["Status"]), progress: progress === "" || progress == null ? null : Number(progress),
      owners: [str(r["Owner 1 (Lead)"]), str(r["Owner 2"]), str(r["Owner 3"])],
      openDate: toDate(raw.open), due: toDate(raw.due), lu: str(r["Latest Update"]), luDate: toDate(raw.lud),
      blocker: str(r["Blocker / Decision"]), decision: toBool(r["Decision Required"]), critical: toBool(r["Critical for Opening"]),
      baselineDue: toDate(r["Baseline Due Date"]) || null,
    };
    t.opening = byPair.get(`${t.type}|${t.location}`) || null;
    const prefix = t.id.replace(/-\d{3}$/, "");
    const prefOpening = byCode.get(prefix) || null;
    if (!t.opening && prefOpening) t.opening = prefOpening;
    if (t.opening) t.opening.tasks.push(t);
    t.isOpen = t.status !== "Completed" && t.status !== "N/A";
    t.applicable = t.status !== "N/A";

    // timeline: TASK_HISTORY notes + Latest Update if not yet recorded there
    const notes = (notesBy.get(t.id) || []).slice();
    if (t.lu && !notes.some((n) => n.text === t.lu)) notes.push({ date: t.luDate || null, rec: Infinity, text: t.lu, type: "Update", source: "latest" });
    notes.sort((a, b) => ((b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0)) || (b.rec - a.rec));
    t.notes = notes;
    t.lastUpdate = notes.find((n) => n.date)?.date || null;

    // derived signals (project, not data errors)
    t.overdue = t.isOpen && t.due && t.due < TODAY;
    t.dueSoon = t.isOpen && t.due && !t.overdue && wdBetween(TODAY, t.due) <= 5;
    t.stale = t.isOpen && (!t.lastUpdate || wdBetween(t.lastUpdate, TODAY) > 10);
    t.slip = t.baselineDue && t.due ? wdBetween(t.baselineDue, t.due) : null;

    // data quality checks
    const E = [], W = [];
    if (!t.id) E.push("Task ID missing");
    else {
      if (idCount.get(t.id) > 1) E.push("Duplicate Task ID");
      if (!/^[A-Z]+(-[A-Z]+)*-\d{3}$/.test(t.id)) E.push("Task ID format (expected CODE-001)");
    }
    const mand = [["Opening Type", t.type], ["Location", t.location], ["Macro Area", t.macro], ["Task", t.task], ["Status", t.status], ["Progress %", t.progress]];
    const mMiss = mand.filter(([, v]) => v === "" || v == null).map(([k]) => k);
    if (mMiss.length) E.push("Missing: " + mMiss.join(", "));
    if (t.type && t.location && !byPair.has(`${t.type}|${t.location}`)) E.push("Opening Type + Location not in OPENINGS");
    else if (t.id && t.opening && prefix !== t.opening.code) E.push(`ID prefix ≠ opening code (${t.opening.code})`);
    if (t.macro && macros && (t.sub ? !areaPairs.has(`${t.macro}|${t.sub}`) : !macros.has(t.macro))) E.push("Macro / Sub Area not in AREAS");
    if (t.status && !STATUSES.includes(t.status)) E.push(`Invalid status "${t.status}"`);
    if (t.progress != null && !PROGRESS.includes(t.progress)) E.push("Progress must be 0, 25, 50, 75 or 100");
    if (owners) t.owners.filter((o) => o && !owners.has(o)).forEach((o) => E.push(`Owner "${o}" not in OWNERS`));
    if ([raw.open, raw.due, raw.lud].some((v) => toDate(v) === undefined)) E.push("Invalid date");
    if (!t.owners[0] && (t.owners[1] || t.owners[2])) E.push("Owner 2/3 without Owner 1");
    if (t.isOpen && !t.owners[0]) W.push("Owner 1 missing");
    if (t.isOpen && !t.due) W.push("Due Date missing");
    if (t.status === "Completed" && t.progress !== 100) W.push("Completed with progress below 100%");
    if (t.progress === 100 && t.status !== "Completed") W.push("100% but not Completed");
    if ((t.status === "Blocked" || t.decision) && !t.blocker) W.push("Blocker / Decision is empty");
    if (t.status === "N/A" && !t.lu) W.push("N/A without a reason");
    if (t.lu && !t.luDate) W.push("Latest Update without date");
    if ((t.openDate && t.openDate > TODAY) || (t.luDate && t.luDate > TODAY)) W.push("Date in the future");
    if (t.openDate && t.due && t.openDate > t.due) W.push("Open Date after Due Date");
    if (t.critical && t.isOpen && t.due && t.opening?.current && t.due > t.opening.current) W.push("Critical task due after opening date");
    const os = t.owners.filter(Boolean); if (new Set(os).size !== os.length) W.push("Same owner repeated");
    t.errors = E; t.warnings = W;
    return t;
  });

  openings.forEach((o) => { o.m = metrics(o.tasks); });
  return { openings, tasks, areaOrder };
}

function metrics(ts) {
  const app = ts.filter((t) => t.applicable);
  return {
    total: ts.length, applicable: app.length, done: ts.filter((t) => t.status === "Completed").length,
    open: ts.filter((t) => t.isOpen).length, overdue: ts.filter((t) => t.overdue).length,
    blocked: ts.filter((t) => t.status === "Blocked").length, decisions: ts.filter((t) => t.decision && t.isOpen).length,
    critical: ts.filter((t) => t.critical && t.isOpen).length,
    errors: ts.filter((t) => t.errors.length).length, warnings: ts.filter((t) => !t.errors.length && t.warnings.length).length,
  };
}

// ---------------------------------------------------------------- state
const S = {
  model: null, file: null, loadedAt: null, demo: false,
  view: "program", opening: null, mode: "outline",

function load(buf, name, demo) {
  try {

    const model = buildModel(wb);
    Object.assign(S, { model, file: name, loadedAt: new Date(), demo, task: null });
    if (!model.openings.some((o) => o.code === S.opening)) {
      S.opening = (model.openings.filter((o) => o.tasks.length).sort((a, b) => (a.current || 0) - (b.current || 0))[0] || model.openings[0] || {}).code || null;

}
const BAR = [["Completed", "seg-done"], ["In Progress", "seg-progress"], ["Blocked", "seg-blocked"], ["Not Started", "seg-todo"]];
function statusBar(ts, big) {
  const app = ts.filter((t) => t.applicable);

  return `<div class="sbar${big ? " big" : ""}" title="${segs.map(([s, , n]) => `${s} ${n}`).join(" · ") || "No tasks"}">${segs.map(([, c, n]) => `<span class="seg ${c}" style="flex:${n}"></span>`).join("")}</div>`;
}
const statusLegend = (ts) => { const app = ts.filter((t) => t.applicable), na = ts.length - app.length; return `<div class="legend num">${BAR.map(([s, c]) => `<span><i class="${c}"></i>${s} <b>${app.filter((t) => t.status === s).length}</b></span>`).join("")}${na ? `<span>N/A <b>${na}</b></span>` : ""}</div>`; };
const pctDone = (ts) => { const a = ts.filter((t) => t.applicable).length; return a ? Math.round((ts.filter((t) => t.status === "Completed").length / a) * 100) : null; };
const DOT = { "Blocked": "d-blocked", "In Progress": "d-progress", "Completed": "d-done", "Not Started": "d-todo", "N/A": "d-na" };
const byAreaOrder = (m) => (a, b) => (m.areaOrder.get(a[0]) ?? 99) - (m.areaOrder.get(b[0]) ?? 99) || a[0].localeCompare(b[0]);
const groupBy = (ts, key) => { const g = new Map(); ts.forEach((t) => { const k = key(t); if (!g.has(k)) g.set(k, []); g.get(k).push(t); }); return g; };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
const flagHtml = (t) => t.errors.length ? `<span class="flag err" title="${esc(t.errors.join(" · "))}">${t.errors.length}</span>` : t.warnings.length ? `<span class="flag warn" title="${esc(t.warnings.join(" · "))}">!</span>` : "";

// ---------------------------------------------------------------- filters
const SIGNALS = [["overdue", "Overdue"], ["blocked", "Blocked"], ["decision", "Decision required"], ["critical", "Critical for opening"], ["stale", "No update for 10+ wd"], ["issues", "Data issues"]];
const sigMatch = (t, s) => ({ overdue: t.overdue, blocked: t.status === "Blocked", decision: t.decision && t.isOpen, critical: t.critical && t.isOpen, stale: t.stale, issues: t.errors.length || t.warnings.length }[s]);
function filtered(ts) {
  const f = S.f, q = f.q.toLowerCase();

    (!q || [t.id, t.task, t.desc, t.lu, t.blocker, t.macro, t.sub, t.opening?.location, ...t.owners].join(" ").toLowerCase().includes(q)) &&
    (!f.status.length || f.status.includes(t.status)) && (!f.owner.length || t.owners.some((o) => f.owner.includes(o))) &&
    (!f.area.length || f.area.includes(t.macro)) && (!f.sig.length || f.sig.some((s) => sigMatch(t, s))) &&
    (!S.cell || (t.opening?.code === S.cell.code && t.macro === S.cell.area)));

function multi(key, label, options) {
  const sel = S.f[key];
  return `<div class="ms"><button type="button" class="ms-btn" data-ms="${key}" aria-expanded="${S.pop === key}">${label}${sel.length ? ` <b>${sel.length}</b>` : ""} <span class="car">▾</span></button>
    ${S.pop === key ? `<div class="ms-pop" role="group" aria-label="${label}">${options.map(([v, l, n]) => `<label><input type="checkbox" data-msv="${key}" value="${esc(v)}"${sel.includes(v) ? " checked" : ""}><span>${esc(l)}</span><span class="muted num">${n ?? ""}</span></label>`).join("")}
      <div class="ms-foot"><button type="button" class="linkbtn" data-msclear="${key}">Clear</button><button type="button" class="linkbtn" data-msclose>Done</button></div></div>` : ""}</div>`;
}
function filterBar(scope, opts) {
  const count = (fn) => (v) => scope.filter((t) => fn(t, v)).length;
  const areas = [...groupBy(scope, (t) => t.macro).keys()].map((a) => [a]).sort(byAreaOrder(S.model)).map(([a]) => [a, a || "—", count((t, v) => t.macro === v)(a)]);
  const owners = [...new Set(scope.flatMap((t) => t.owners).filter(Boolean))].sort().map((o) => [o, o, count((t, v) => t.owners.includes(v))(o)]);
  const statuses = STATUSES.map((s) => [s, s, count((t, v) => t.status === v)(s)]);
  const sigs = SIGNALS.map(([v, l]) => [v, l, scope.filter((t) => sigMatch(t, v)).length]);
  const chips = [];
  ["area", "owner", "status"].forEach((k) => S.f[k].forEach((v) => chips.push([k, v, v])));
  S.f.sig.forEach((v) => chips.push(["sig", v, SIGNALS.find((s) => s[0] === v)?.[1] || v]));
  if (S.cell) chips.push(["cell", "", `${S.model.openings.find((o) => o.code === S.cell.code)?.location} · ${S.cell.area}`]);
  const n = filtered(scope).length;
  return `<div class="filters">
      <input type="search" id="f-q" placeholder="Search" value="${esc(S.f.q)}" aria-label="Search tasks">
      ${opts.area ? multi("area", "Area", areas) : ""}${multi("owner", "Owner", owners)}${multi("status", "Status", statuses)}${multi("sig", "Show only", sigs)}

}

// ---------------------------------------------------------------- program
function programView(m) {
  const ops = m.openings.slice().sort((a, b) => (a.current || Infinity) - (b.current || Infinity));
  const all = metrics(m.tasks);
  const attention = ops.filter((o) => o.m.blocked || o.m.overdue);
  const next = ops.find((o) => o.status !== "Opened" && o.current && o.current >= TODAY);
  const moved = ops.filter((o) => o.delay > 0).sort((a, b) => b.delay - a.delay);
  const withTasks = ops.filter((o) => o.m.total).length;
  const pct = pctDone(m.tasks);

  const story = `<section class="story">
    <div class="eyebrow">Program · ${fmtDate(TODAY)}</div>
    <h1>${plural(ops.length, "opening")}. ${attention.length ? `${plural(attention.length, "needs", "need")} attention.` : "Nothing blocked or overdue."}</h1>
    <ul class="story-list">
      ${next ? `<li><span>Next opening is <button type="button" data-open="${esc(next.code)}"><b>${esc(next.location)}</b></button> on <b>${fmtDate(next.current)}</b>, in ${next.remaining} working days.</span></li>` : ""}
      ${moved.length ? `<li><span><b>${plural(moved.length, "opening")}</b> moved the date: ${moved.slice(0, 4).map((o) => `<button type="button" data-open="${esc(o.code)}">${esc(o.location)}</button> <span class="red">${signed(o.delay)} wd</span>`).join(", ")}${moved.length > 4 ? "…" : ""}</span></li>` : ""}
      <li><span><b>${plural(m.tasks.length, "task")}</b> tracked on ${withTasks} of ${ops.length} openings, <b>${pct ?? 0}%</b> completed.</span></li>
      <li><span>${[["blocked", all.blocked, "blocked", "red"], ["overdue", all.overdue, "overdue", "red"], ["decision", all.decisions, all.decisions === 1 ? "decision waiting" : "decisions waiting", "amber"]].map(([k, n, l, c]) => n ? `<button type="button" data-sig="${k}"><b class="${c}">${n} ${l}</b></button>` : `0 ${l}`).join(", ")}.</span></li>
    </ul>
  </section>`;

  // runway scale
  const pts = ops.flatMap((o) => [o.start, o.current, o.baseline]).filter(Boolean).concat([TODAY]);
  const min = new Date(Math.min(...pts)); min.setDate(min.getDate() - 10);
  const max = new Date(Math.max(...pts)); max.setDate(max.getDate() + 20);
  const pos = (d) => ((d - min) / (max - min)) * 100;
  const ticks = [];
  for (let d = new Date(min.getFullYear(), min.getMonth() + 1, 1); d < max; d.setMonth(d.getMonth() + 1)) {
    ticks.push(`<span style="left:${pos(d)}%">${MONTHS[d.getMonth()]}${d.getMonth() === 0 || !ticks.length ? " " + String(d.getFullYear()).slice(2) : ""}</span>`);
  }
  const todayX = pos(TODAY);
  const row = (o) => {
    const x = o.m, p = pctDone(o.tasks);
    const start = o.start || o.current;
    let track = "";
    if (o.current) {
      track += `<span class="rw-line" style="left:${pos(start)}%;width:${Math.max(0, pos(o.current) - pos(start))}%"></span>`;
      if (o.start && TODAY > o.start) track += `<span class="rw-elapsed" style="left:${pos(o.start)}%;width:${Math.max(0, pos(TODAY < o.current ? TODAY : o.current) - pos(o.start))}%"></span>`;
      if (o.delay > 0 && o.baseline) track += `<span class="rw-slip" style="left:${pos(o.baseline)}%;width:${pos(o.current) - pos(o.baseline)}%"></span><span class="rw-base" style="left:${pos(o.baseline)}%" title="Baseline ${fmtDate(o.baseline)}"></span>`;
      track += `<span class="rw-dot ${o.status === "Tentative" ? "tent" : ""} ${o.delay > 0 ? "late" : ""}" style="left:${pos(o.current)}%" title="Opening ${fmtDate(o.current)}"></span>`;
    }
    track += `<span class="rw-today" style="left:${todayX}%"></span>`;
    const sig = [x.blocked && `<span class="red">${x.blocked} blocked</span>`, x.overdue && `<span class="red">${x.overdue} overdue</span>`, x.decisions && `<span class="amber">${plural(x.decisions, "decision")}</span>`].filter(Boolean);
    return `<button type="button" class="rw-row" data-open="${esc(o.code)}">
      <span class="rw-name"><b>${esc(o.location)}</b><span>${o.complexity ? cxIcon(o.complexity) : ""}<span class="mono">${esc(o.code)}</span>${o.status === "Tentative" ? " · tentative" : ""}</span></span>
      <span class="rw-track" aria-hidden="true">${track}</span>
      <span class="rw-date num">${o.delay > 0 ? `<s>${fmtDate(o.baseline)}</s>` : ""}<b>${fmtDate(o.current)}</b><span>${daysLeftText(o)}</span></span>
      <span class="rw-prog">${x.total ? donut(p) + `<span class="sig num"><span>${x.done} of ${x.applicable} done</span>${sig.length ? `<span>${sig.join(" · ")}</span>` : '<span class="muted">No blockers</span>'}</span>` : '<span class="muted" style="font-size:14px">No tasks yet</span>'}</span>
    </button>`;
  };
  const axis = `<div class="rw-axis"><span></span><span class="rw-ticks num">${ticks.join("")}<span class="today" style="left:${todayX}%">Today</span></span><span class="hint">Opening date</span><span class="hint">Tasks</span></div>`;
  const grp = (type, label) => { const l = ops.filter((o) => o.type === type); return l.length ? `<h2 class="rw-group">${label} · ${l.length}</h2>${l.map(row).join("")}` : ""; };
  const other = ops.filter((o) => o.type !== "New Store" && o.type !== "New Company");

  return story + `<section>
    <div class="sec-head"><h2>Timeline to opening</h2></div>
    <div class="legend-rw"><span><span class="lg-el"></span>Time elapsed since kick-off</span><span><span class="lg-dot"></span>Opening date</span><span><span class="lg-dot tent"></span>Tentative</span><span><span class="lg-slip"></span><span class="lg-dot late"></span>Moved from baseline</span></div>
    <div class="rw-scroll"><div class="rw">${axis}${grp("New Store", "New stores")}${grp("New Company", "New companies")}${other.length ? `<h2 class="rw-group">Other</h2>${other.map(row).join("")}` : ""}</div></div>
    <p class="hint" style="margin-top:12px;padding:0 12px">All figures are calculated from the loaded Action Log. Working days exclude Saturday and Sunday. Click an opening to see its detail.</p>
  </section>`;
}

// ---------------------------------------------------------------- opening
function attentionList(scope, showOpening) {
  const rank = (t) => (t.status === "Blocked" ? 0 : t.overdue ? 1 : t.decision ? 2 : 3);
  const list = scope.filter((t) => t.isOpen && (t.status === "Blocked" || t.overdue || t.decision || (t.critical && t.dueSoon))).sort((a, b) => rank(a) - rank(b) || ((a.due || 0) - (b.due || 0)));
  const reason = (t) => t.status === "Blocked" ? ["Blocked", "st-blocked"] : t.overdue ? ["Overdue", "st-blocked"] : t.decision ? ["Decision", "st-dec"] : ["Due soon", "st-soon"];
  return `<div class="att-box"><h2>Needs attention · ${list.length}</h2>${list.length ? `<ul class="att">${list.slice(0, 7).map((t) => { const [r, c] = reason(t); return `<li><button type="button" data-task="${esc(t.id)}"><span class="pill ${c}">${r}</span><span class="att-t">${esc(t.task)}<span class="sub">${showOpening ? esc(t.opening?.location || "") + " · " : ""}${esc(t.macro)} · ${esc(t.owners[0] || "no owner")} · due ${fmtDate(t.due, false)}</span></span></button></li>`; }).join("")}</ul>${list.length > 7 ? `<p class="hint" style="padding:6px">and ${list.length - 7} more. Use "Show only" below.</p>` : ""}` : `<p class="hint" style="margin-top:8px">Nothing blocked, overdue or waiting for a decision.</p>`}</div>`;
}

function outline(list, m) {
  const groups = [...groupBy(list, (t) => t.macro).entries()].sort(byAreaOrder(m));
  return `<div class="ol">${groups.map(([area, ts]) => {
    const open = !S.collapsed.includes(area);
    const x = metrics(ts);
    const leads = [...new Set(ts.map((t) => t.owners[0]).filter(Boolean))];
    const sig = [x.blocked && `<span class="red">${x.blocked} blocked</span>`, x.overdue && `<span class="red">${x.overdue} overdue</span>`].filter(Boolean).join(" · ");
    return `<div class="ol-area">
      <button type="button" class="ol-head" data-coll="${esc(area)}" aria-expanded="${open}"><span class="car">▾</span>
        <span class="an">${esc(area || "No area")}<span>${esc(leads.slice(0, 2).join(", "))}${leads.length > 2 ? ` +${leads.length - 2}` : ""}</span></span>
        ${statusBar(ts)}<span class="ac num">${x.done}/${x.applicable} done${sig ? " · " + sig : ""}</span></button>
      ${open ? `<ul class="ol-tasks">${ts.slice().sort(taskOrder).map((t) => {
        const owners = t.owners.filter(Boolean);
        const top = t.notes[0];
        const line = t.isOpen && t.blocker && (t.status === "Blocked" || t.decision)
          ? `<span class="blk">${t.status === "Blocked" ? "Blocked: " : "Decision: "}${esc(t.blocker)}</span>`
          : top ? `<b>${fmtDate(top.date, false)}</b> · ${esc(top.text)}` : "No updates yet";
        return `<li><button type="button" class="ol-task${t.isOpen ? "" : " done"}${S.task === t.id ? " sel" : ""}" data-task="${esc(t.id)}">
          <span class="dot ${DOT[t.status] || "d-blocked"}" title="${esc(t.status)}"></span>
          <span class="tt"><span class="mono">${esc(t.id)}</span>${esc(t.task)}${tags(t)}${flagHtml(t)}</span>
          <span class="ow">${esc(owners[0] || "No owner")}${owners.length > 1 ? ` +${owners.length - 1}` : ""}</span>
          <span class="du num ${dueCls(t)}">${fmtDate(t.due, false)}</span>
          <span class="pr num">${t.progress == null ? "—" : t.progress + "%"}</span>
          <span class="up">${line}${t.stale && !(t.blocker && (t.status === "Blocked" || t.decision)) ? ' · <span class="amber">no update for 10+ wd</span>' : ""}</span>
        </button></li>`;
      }).join("")}</ul>` : ""}
    </div>`;
  }).join("")}</div>`;
}

function card(t) {
  const owners = t.owners.filter(Boolean);
  if (t.status === "Completed") return `<button type="button" class="card done" data-task="${esc(t.id)}">${esc(t.task)}</button>`;
  return `<button type="button" class="card${S.task === t.id ? " sel" : ""}" data-task="${esc(t.id)}">
    <span class="card-top"><span class="mono">${esc(t.id)}</span>${tags(t)}${flagHtml(t)}</span>
    <span class="card-title">${esc(t.task)}</span>
    ${t.blocker && (t.status === "Blocked" || t.decision) ? `<span class="card-blk">${esc(t.blocker)}</span>` : ""}
    <span class="card-meta"><span>${esc(owners[0] || "No owner")}${owners.length > 1 ? ` +${owners.length - 1}` : ""}</span><span class="num ${dueCls(t)}">${fmtDate(t.due, false)}</span></span>
  </button>`;
}
function board(list, m) {
  const cols = ["Not Started", "In Progress", "Blocked", "Completed"];
  const lanes = [...groupBy(list, (t) => t.macro).entries()].sort(byAreaOrder(m));
  const na = list.filter((t) => t.status === "N/A").length;
  return `<div class="board-wrap"><div class="board"><div class="bcol-head"></div>${cols.map((c) => `<div class="bcol-head"><span class="pill ${STATUS_CLASS[c]}">${c}</span> <span class="num muted">${list.filter((t) => t.status === c).length}</span></div>`).join("")}
    ${lanes.map(([area, ts]) => `<div class="lane-head">${esc(area || "No area")}<span class="muted num">${ts.filter((t) => t.status === "Completed").length}/${ts.filter((t) => t.applicable).length} done</span></div>${cols.map((c) => `<div class="bcell">${ts.filter((t) => t.status === c).sort(taskOrder).map(card).join("")}</div>`).join("")}`).join("")}
  </div></div>${na ? `<p class="hint">${plural(na, "N/A task")} not shown on the board.</p>` : ""}`;
}

function openingView(m) {
  const o = m.openings.find((x) => x.code === S.opening) || m.openings[0];
  if (!o) return '<p class="empty">No openings in the loaded file.</p>';
  const scope = o.tasks, x = metrics(scope), pct = pctDone(scope);
  const moves = o.dateHistory.length > 1 ? o.dateHistory.slice(1).map((h, i) => `${fmtDate(o.dateHistory[i].date)} → ${fmtDate(h.date)} on ${fmtDate(h.decided)}${h.reason ? ` (${esc(h.reason)})` : ""}`).join("; ") : "";
  const sigLine = [x.blocked && `<b class="red">${x.blocked} blocked</b>`, x.overdue && `<b class="red">${x.overdue} overdue</b>`, x.decisions && `<b class="amber">${x.decisions === 1 ? "1 decision" : x.decisions + " decisions"} waiting</b>`].filter(Boolean);

  const id = `<section class="idcard">
    <div class="id-main">
      <div>
        <div class="eyebrow">${icon(o.type === "New Company" ? "company" : "store")}${esc(o.type)} · <span class="mono">${esc(o.code)}</span></div>
        <h1>${esc(o.location)}</h1>
      </div>
      <div class="idrow">
        ${o.country ? `<span title="Country">${icon("pin")}${esc(o.country)}</span>` : ""}
        ${o.complexity ? `<span title="Complexity (input in OPENINGS)">${cxIcon(o.complexity)}${esc(o.complexity)} complexity</span>` : ""}
        <span title="Opening date">${icon("cal")}${o.delay > 0 ? `<s class="num">${fmtDate(o.baseline)}</s>` : ""}<b class="num">${fmtDate(o.current)}</b>${o.delay > 0 ? `<b class="red num">${signed(o.delay)} wd</b>` : ""}</span>
        <span title="Working days to opening (Mon–Fri)">${icon("clock")}${o.status === "Opened" ? "Opened" : o.remaining == null ? "—" : o.remaining < 0 ? `<span class="red">${-o.remaining} wd past date</span>` : `${o.remaining} wd to opening`}</span>
        ${o.status ? `<span title="Opening status">${icon("flag")}${esc(o.status)}</span>` : ""}
      </div>
      ${scope.length ? `<div style="display:grid;gap:10px">
        <div class="headline"><b class="num">${pct}%</b> complete, ${x.done} of ${x.applicable} tasks.${sigLine.length ? " " + sigLine.join(", ") + "." : " No blockers."}</div>
        ${statusBar(scope, true)}${statusLegend(scope)}</div>` : '<p class="hint">No tasks for this opening in the Action Log yet.</p>'}
      ${moves ? `<p class="hint">Opening date moved: ${moves}.</p>` : ""}
    </div>
    ${attentionList(scope, false)}
  </section>`;

  if (!scope.length) return id;
  const list = filtered(scope);
  const areasInList = [...new Set(list.map((t) => t.macro))];
  const tasks = `<section style="display:grid;gap:14px">
    <div class="sec-head" style="margin:0"><h2>By area</h2><span class="spacer"></span>
      ${S.mode === "outline" ? `<button type="button" class="linkbtn" id="coll-all">${areasInList.every((a) => S.collapsed.includes(a)) ? "Expand all" : "Collapse all"}</button>` : ""}
      <div class="seg-ctl" role="group" aria-label="Task view"><button type="button" data-mode="outline" aria-pressed="${S.mode === "outline"}">Outline</button><button type="button" data-mode="board" aria-pressed="${S.mode === "board"}">Board</button></div>
    </div>
    ${filterBar(scope, { area: true })}
    ${list.length ? (S.mode === "board" ? board(list, m) : outline(list, m)) : '<p class="empty">No tasks match these filters.</p>'}
  </section>`;
  return id + tasks;
}

// ---------------------------------------------------------------- areas (cross-opening)
function areasView(m) {
  const allAreas = [...groupBy(m.tasks, (t) => t.macro).keys()].map((a) => [a]).sort(byAreaOrder(m)).map(([a]) => a);
  const cols = S.f.area.length ? allAreas.filter((a) => S.f.area.includes(a)) : allAreas;
  const ops = m.openings.filter((o) => o.tasks.length).sort((a, b) => (a.current || Infinity) - (b.current || Infinity));
  const cell = (o, a) => {
    const ts = o.tasks.filter((t) => t.macro === a);
    if (!ts.length) return `<td><span class="mx-cell none">·</span></td>`;
    const x = metrics(ts), p = pctDone(ts) ?? 0;
    const on = S.cell && S.cell.code === o.code && S.cell.area === a;
    return `<td><button type="button" class="mx-cell${on ? " on" : ""}" data-cell="${esc(o.code)}|${esc(a)}" style="background:color-mix(in srgb, var(--green) ${Math.round(8 + p * 0.5)}%, var(--surface))" title="${esc(o.location)} · ${esc(a)}: ${x.done} of ${x.applicable} completed${x.blocked ? `, ${x.blocked} blocked` : ""}${x.overdue ? `, ${x.overdue} overdue` : ""}"><span class="num">${x.done}/${x.applicable}</span>${x.blocked || x.overdue ? "<i></i>" : ""}</button></td>`;
  };
  const scope = m.tasks;
  const list = filtered(scope);
  const byOpening = [...groupBy(list, (t) => t.opening?.code || "?").entries()].sort((a, b) => ((m.openings.find((o) => o.code === a[0])?.current) || Infinity) - ((m.openings.find((o) => o.code === b[0])?.current) || Infinity));
  const rows = byOpening.map(([code, ts]) => {
    const o = m.openings.find((x) => x.code === code);
    return `<tr class="grp"><td colspan="8">${esc(o?.location || "Unknown opening")} <span class="muted" style="font-weight:400">· ${fmtDate(o?.current)} · ${o ? daysLeftText(o) : ""} · ${plural(ts.length, "task")}</span></td></tr>` +
      ts.slice().sort((a, b) => byAreaOrder(m)([a.macro], [b.macro]) || taskOrder(a, b)).map((t) => {
        const owners = t.owners.filter(Boolean), top = t.notes[0];
        return `<tr class="row${t.isOpen ? "" : " done"}${S.task === t.id ? " sel" : ""}" data-task="${esc(t.id)}" tabindex="0">
          <td class="nowrap"><span class="mono">${esc(t.id)}</span>${flagHtml(t)}</td>
          <td>${esc(t.macro)}${t.sub ? `<div class="sub">${esc(t.sub)}</div>` : ""}</td>
          <td><span class="tt">${esc(t.task)}</span>${tags(t)}${t.isOpen && t.blocker ? `<div class="sub ${t.status === "Blocked" ? "red" : ""}">${esc(t.blocker)}</div>` : ""}</td>
          <td class="nowrap">${esc(owners[0] || "—")}${owners.length > 1 ? `<div class="sub">${esc(owners.slice(1).join(", "))}</div>` : ""}</td>
          <td class="nowrap num ${dueCls(t)}">${fmtDate(t.due, false)}</td>
          <td><span class="pill ${STATUS_CLASS[t.status] || "st-bad"}">${esc(t.status || "—")}</span></td>
          <td class="num">${t.progress == null ? "—" : t.progress + "%"}</td>
          <td style="max-width:360px">${top ? `${esc(top.text)}<div class="sub">${fmtDate(top.date, false)}</div>` : '<span class="muted">—</span>'}</td>
        </tr>`;
      }).join("");
  }).join("");

  return `<section class="story" style="max-width:none">
      <div class="eyebrow">Across openings</div>
      <h1>${S.f.area.length ? S.f.area.map(esc).join(", ") : "All areas"}</h1>
      <p class="hint" style="font-size:15px">Pick one or more areas to compare them on every opening. Click a cell to see its tasks.</p>
      <div class="area-chips"><button type="button" class="achip" data-achip="" aria-pressed="${!S.f.area.length}">All areas</button>${allAreas.map((a) => `<button type="button" class="achip" data-achip="${esc(a)}" aria-pressed="${S.f.area.includes(a)}">${esc(a || "No area")}</button>`).join("")}</div>
    </section>
    <section>
      <div class="sec-head"><h2>Completed tasks per opening and area</h2><span class="hint">Cell = completed / applicable · greener = more complete · red dot = blocked or overdue</span></div>
      <div class="mx-wrap"><table class="mx"><thead><tr><th></th>${cols.map((a) => `<th>${esc(a)}</th>`).join("")}</tr></thead>
        <tbody>${ops.map((o) => `<tr><th class="rowh" scope="row">${esc(o.location)}</th>${cols.map((a) => cell(o, a)).join("")}</tr>`).join("")}</tbody></table></div>
    </section>
    <section style="display:grid;gap:14px">
      <div class="sec-head" style="margin:0"><h2>Tasks by opening</h2></div>
      ${filterBar(scope, { area: false })}
      ${list.length ? `<div class="xt-wrap"><table class="xt"><thead><tr><th>ID</th><th>Area</th><th>Task</th><th>Owner</th><th>Due</th><th>Status</th><th>Progress</th><th>Latest update</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">No tasks match these filters.</p>'}
    </section>`;
}

// ---------------------------------------------------------------- panel
function renderPanel() {
  const t = S.task && S.model ? S.model.tasks.find((x) => x.id === S.task) : null;
  $("panel").hidden = $("scrim").hidden = !t;
  if (!t) return;
  const owners = t.owners.filter(Boolean);
  const checks = (t.errors.length ? `<div class="box errbox"><b>Data errors</b><ul>${t.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : "") +
    (t.warnings.length ? `<div class="box warnbox"><b>Data warnings</b><ul>${t.warnings.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : "");
  $("panel").innerHTML = `
    <div class="panel-head">
      <div class="panel-top"><span class="mono muted">${esc(t.id)} · ${esc(t.opening?.location || t.location)} · ${esc(t.macro)}${t.sub ? " · " + esc(t.sub) : ""}</span><button type="button" class="x" id="p-close" aria-label="Close">×</button></div>
      <h3>${esc(t.task)}</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${STATUS_CLASS[t.status] || "st-bad"}">${esc(t.status || "—")}</span>${tags(t)}</div>
    </div>
    <div class="panel-body">
      ${checks}
      ${t.blocker ? `<div class="box"><div class="eyebrow">${t.status === "Blocked" ? "Blocker" : "Decision needed"}</div><div style="margin-top:4px">${esc(t.blocker)}</div></div>` : ""}
      <dl class="kv">
        <dt>Owner</dt><dd>${esc(owners[0] || "—")}${owners.length > 1 ? `<div class="sub">with ${esc(owners.slice(1).join(", "))}</div>` : ""}</dd>
        <dt>Due</dt><dd class="num ${t.overdue ? "due-over" : ""}">${fmtDate(t.due)}${t.slip ? `<div class="sub">baseline ${fmtDate(t.baselineDue)}, moved ${signed(t.slip)} wd</div>` : ""}</dd>
        <dt>Progress</dt><dd>${t.progress == null ? "—" : `<div class="prog"><div class="track"><span class="fill" style="width:${t.progress}%"></span></div><span class="num">${t.progress}%</span></div>`}</dd>
        <dt>Opened</dt><dd class="num">${fmtDate(t.openDate)}${t.openDate && t.isOpen ? ` <span class="muted">· open for ${wdBetween(t.openDate, TODAY)} wd</span>` : ""}</dd>
        ${t.desc ? `<dt>Description</dt><dd>${esc(t.desc)}</dd>` : ""}
      </dl>
      <section><h2>Updates</h2>
        ${t.notes.length ? `<ol class="tl">${t.notes.map((n) => `<li><span class="d num">${fmtDate(n.date)}${n.type === "Decision" ? '<span class="tag dec">Decision</span>' : ""}</span><span class="t">${esc(n.text)}</span>${n.source === "latest" ? '<span class="s">From Latest Update, not yet in TASK_HISTORY</span>' : ""}</li>`).join("")}</ol>` : '<p class="hint" style="margin-top:8px">No updates recorded yet.</p>'}
      </section>
      <p class="hint">Read-only view. To change this task, edit the Action Log file and load it again.</p>
    </div>`;
  $("p-close").onclick = closePanel;
}
function closePanel() { const id = S.task; S.task = null; renderPanel(); document.querySelectorAll(".sel[data-task]").forEach((r) => r.classList.remove("sel")); const r = id && document.querySelector(`[data-task="${CSS.escape(id)}"]`); if (r) r.focus(); }

// ---------------------------------------------------------------- events
function bindMain() {
  const main = $("main");
  main.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openOpening(b.dataset.open));
  main.querySelectorAll("[data-sig]").forEach((b) => b.onclick = () => { go("areas"); S.f.sig = [b.dataset.sig]; render(); });
  main.querySelectorAll("[data-task]").forEach((r) => {
    const open = () => { S.task = r.dataset.task; main.querySelectorAll(".sel[data-task]").forEach((x) => x.classList.remove("sel")); r.classList.add("sel"); renderPanel(); $("p-close")?.focus(); };
    r.onclick = open; if (r.tagName === "TR") r.onkeydown = (e) => { if (e.key === "Enter") open(); };
  });
  main.querySelectorAll("[data-coll]").forEach((b) => b.onclick = () => { const a = b.dataset.coll; S.collapsed = S.collapsed.includes(a) ? S.collapsed.filter((x) => x !== a) : [...S.collapsed, a]; render(); });
  const ca = $("coll-all");
  if (ca) ca.onclick = () => { const areas = [...main.querySelectorAll("[data-coll]")].map((b) => b.dataset.coll); S.collapsed = areas.every((a) => S.collapsed.includes(a)) ? [] : areas; render(); };
  main.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => { S.mode = b.dataset.mode; remember(); render(); });
  main.querySelectorAll("[data-achip]").forEach((b) => b.onclick = () => { const a = b.dataset.achip; S.cell = null; S.f.area = a === "" ? [] : S.f.area.includes(a) ? S.f.area.filter((x) => x !== a) : [...S.f.area, a]; render(); });
  main.querySelectorAll("[data-cell]").forEach((b) => b.onclick = () => { const [code, area] = b.dataset.cell.split("|"); S.cell = S.cell && S.cell.code === code && S.cell.area === area ? null : { code, area }; render(); });
  main.querySelectorAll("[data-ms]").forEach((b) => b.onclick = () => { S.pop = S.pop === b.dataset.ms ? null : b.dataset.ms; render(); });
  main.querySelectorAll("[data-msv]").forEach((c) => c.onchange = () => { const k = c.dataset.msv; S.f[k] = c.checked ? [...S.f[k], c.value] : S.f[k].filter((v) => v !== c.value); render(); });
  main.querySelectorAll("[data-msclear]").forEach((b) => b.onclick = () => { S.f[b.dataset.msclear] = []; render(); });
  main.querySelectorAll("[data-msclose]").forEach((b) => b.onclick = () => { S.pop = null; render(); });
  main.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { const k = b.dataset.rm; if (k === "cell") S.cell = null; else S.f[k] = S.f[k].filter((v) => v !== b.dataset.v); render(); });
  const fc = $("f-clear"); if (fc) fc.onclick = () => { resetFilters(); render(); };
  const q = $("f-q");
  if (q) q.oninput = () => { S.f.q = q.value; const pos = q.selectionStart; render(); const n = $("f-q"); n.focus(); n.setSelectionRange(pos, pos); };
}
document.addEventListener("click", (e) => {
  if (S.pop && !e.target.closest(".ms")) { S.pop = null; render(); }
  if (S.menu && !e.target.closest(".menu")) { S.menu = false; renderNav(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (S.task) closePanel(); else if (S.pop) { S.pop = null; render(); } else if (S.menu) { S.menu = false; renderNav(); }
});
$("scrim").onclick = closePanel;

function readFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => load(new Uint8Array(r.result), file.name, false);
  r.onerror = () => { $("alert-text").textContent = "The file could not be opened. Export it again as .xlsx and retry."; $("alert").hidden = false; };
  r.readAsArrayBuffer(file);
}
$("file-input").onchange = (e) => { readFile(e.target.files[0]); e.target.value = ""; };
document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drop"); });
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("drop"); });
document.addEventListener("drop", (e) => { e.preventDefault(); document.body.classList.remove("drop"); readFile(e.dataTransfer.files[0]); });

// open on the demo workbook so the page starts in a working state
(function start() {
  const bin = atob(DEMO_B64); const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  load(buf, "Demo · GG_Opening_Action_Log.xlsx", true);
})();
</script>
